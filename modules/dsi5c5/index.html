<style>
  /* iletisim-form-sekme — Form ve iletişim bilgisini aynı alanda paylaştırır; uzun sayfa yerine tek kartta iki görünüm. */
  .modulex-iletisim-form-sekme { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-iletisim-form-sekme *, .modulex-iletisim-form-sekme *::before, .modulex-iletisim-form-sekme *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-form-sekme :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-iletisim-form-sekme :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-iletisim-form-sekme :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-iletisim-form-sekme :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-form-sekme img { display: block; max-width: 100%; }

  :where(.modulex-iletisim-form-sekme) img { height: auto; }

  .modulex-iletisim-form-sekme :where(a, button, summary, [data-cevir]) { cursor: pointer; }

  .modulex-iletisim-form-sekme-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-iletisim-form-sekme-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-iletisim-form-sekme-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }

  .modulex-iletisim-form-sekme-dugme:hover { transform: translateY(-2px); }

  .modulex-iletisim-form-sekme-kap { max-width: 900px; margin-inline: auto; }
  .modulex-iletisim-form-sekme-sekmeler { display: flex; gap: 6px; padding: 6px; margin: 0 auto 18px; width: fit-content; max-width: 100%; border-radius: 999px; background: --kartBg--; }
  .modulex-iletisim-form-sekme:not(.modulex-iletisim-form-sekme--js) .modulex-iletisim-form-sekme-sekmeler { display: none; }
  .modulex-iletisim-form-sekme-sekme { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 8px 20px; border: 0; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-weight: 700; transition: background 0.25s ease, color 0.25s ease; }
  .modulex-iletisim-form-sekme-sekme .material-symbols-outlined { font-size: 20px; }
  .modulex-iletisim-form-sekme-sekme[aria-selected="true"] { background: --accent--; color: --accentText--; }
  .modulex-iletisim-form-sekme-panel { display: grid; gap: 20px; padding: clamp(22px, 4vw, 44px); border-radius: --yuvarlak--; background: --kartBg--; animation: modulex-iletisim-form-sekme-gel 0.35s ease both; }
  .modulex-iletisim-form-sekme:not(.modulex-iletisim-form-sekme--js) .modulex-iletisim-form-sekme-panel + .modulex-iletisim-form-sekme-panel { margin-block-start: 16px; }
  @keyframes modulex-iletisim-form-sekme-gel { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .modulex-iletisim-form-sekme-liste { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px 24px; }
  .modulex-iletisim-form-sekme-kanal { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .modulex-iletisim-form-sekme-kgovde { display: grid; gap: 2px; min-width: 0; }
  .modulex-iletisim-form-sekme-panel .modulex-iletisim-form-sekme-harita { min-height: 260px; }
  @media (max-width: 768px) {
    .modulex-iletisim-form-sekme-sekmeler { width: 100%; }
    .modulex-iletisim-form-sekme-sekme { flex: 1 1 0; justify-content: center; padding-inline: 10px; }
  }
  .modulex-iletisim-form-sekme-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-form-sekme-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-form-sekme-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-form-sekme-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-form-sekme-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-form-sekme-eylem:hover { gap: 10px; }
  .modulex-iletisim-form-sekme-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-form-sekme-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-form-sekme--kjs .modulex-iletisim-form-sekme-kopya { display: inline-flex; }
  .modulex-iletisim-form-sekme-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-form-sekme-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-form-sekme--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-form-sekme-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-form-sekme-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-form-sekme-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-form-sekme-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-form-sekme-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-form-sekme-cikon { font-size: 18px; }
  .modulex-iletisim-form-sekme-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-form-sekme-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-form-sekme-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-form-sekme-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-form-sekme-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-form-sekme-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-form-sekme-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-form-sekme-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-form-sekme-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  .modulex-iletisim-form-sekme-form { display: grid; gap: 18px; }
  .modulex-iletisim-form-sekme-fbaslik { font-size: 1.3rem; font-weight: 750; }
  .modulex-iletisim-form-sekme-alanlar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .modulex-iletisim-form-sekme-alan { display: flex; flex-direction: column-reverse; gap: 6px; }
  .modulex-iletisim-form-sekme-alan--genis { grid-column: 1 / -1; }
  .modulex-iletisim-form-sekme-etiket { font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-form-sekme-girdi { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid color-mix(in srgb, currentColor 26%, transparent); border-radius: 12px; background: color-mix(in srgb, currentColor 4%, transparent); color: inherit; font: inherit; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  textarea.modulex-iletisim-form-sekme-girdi { min-height: 132px; resize: vertical; }
  .modulex-iletisim-form-sekme-girdi:focus { outline: none; border-color: --accent--; box-shadow: 0 0 0 3px color-mix(in srgb, --accent-- 28%, transparent); }
  .modulex-iletisim-form-sekme-secim { cursor: pointer; }
  .modulex-iletisim-form-sekme-secim option { background: --bg--; color: --text--; }
  .modulex-iletisim-form-sekme-onay { display: flex; gap: 10px; align-items: flex-start; font-size: 0.92rem; }
  .modulex-iletisim-form-sekme-onay input { flex: none; width: 20px; height: 20px; margin-block-start: 2px; accent-color: --accent--; cursor: pointer; }
  .modulex-iletisim-form-sekme-onay a { color: inherit; font-weight: 700; text-underline-offset: 3px; }
  .modulex-iletisim-form-sekme-gonder { justify-self: start; font: inherit; font-weight: 700; cursor: pointer; }
  .modulex-iletisim-form-sekme-gonder:disabled { opacity: 0.6; cursor: progress; }
  .modulex-iletisim-form-sekme-durum { min-height: 1.5em; font-size: 0.95rem; font-weight: 650; }
  .modulex-iletisim-form-sekme-durum:empty { display: none; }
  .modulex-iletisim-form-sekme-durum--hata { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .modulex-iletisim-form-sekme-bal { position: absolute; inset-inline-start: -9999px; width: 1px; height: 1px; overflow: hidden; }
  @media (max-width: 768px) {
    .modulex-iletisim-form-sekme-alanlar { grid-template-columns: minmax(0, 1fr); }
    .modulex-iletisim-form-sekme-gonder { justify-self: stretch; justify-content: center; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-form-sekme :is(.modulex-iletisim-form-sekme-baslik, .modulex-iletisim-form-sekme-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-form-sekme-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-form-sekme { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-form-sekme *, .modulex-iletisim-form-sekme *::before, .modulex-iletisim-form-sekme *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-form-sekme";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    const form = (s, P) => {
        s.querySelectorAll("form[data-fb-form]").forEach((f) => {
          const durum = f.querySelector("[role=status]");
          const yaz = (m, hata) => { if (durum) { durum.textContent = m || ""; durum.classList.toggle(P + "-durum--hata", !!hata); } };
          let t0 = Date.now();
          const al = (ad) => { const e = f.elements.namedItem(ad); return e && "value" in e ? String(e.value).trim() : ""; };
          const etiket = (ad) => { const e = f.elements.namedItem(ad); const l = e && e.id ? f.querySelector(`label[for="${e.id}"]`) : null; return l ? l.textContent.trim() : ad; };
          const konuMetin = () => { const e = f.elements.namedItem("topic"); return e && e.selectedIndex > 0 ? e.options[e.selectedIndex].text.trim() : ""; };
          f.addEventListener("submit", (e) => {
            e.preventDefault();
            if (!f.checkValidity()) { f.reportValidity(); return; }
            if (al("website")) return;
            const govde = ["name", "email", "phone"].filter(al).map((k) => `${etiket(k)}: ${al(k)}`)
              .concat(konuMetin() ? [`${etiket("topic")}: ${konuMetin()}`] : [], al("message") ? ["", al("message")] : []).join("\n");
            const d = f.dataset;
            if (d.action) {
              const b = f.querySelector("[type=submit]");
              if (b) b.disabled = true;
              const yuk = { name: al("name"), email: al("email"), phone: al("phone"), topic: konuMetin(), message: al("message"), kvkk: true, lang: document.documentElement.lang || "", page: location.pathname, website: al("website"), t: Date.now() - t0 };
              fetch(d.action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(yuk) })
                .then((r) => r.json().catch(() => ({})).then((j) => r.ok && j && j.ok !== false))
                .then((ok) => { if (b) b.disabled = false; yaz(ok ? d.ok : d.hata, !ok); if (ok) { f.reset(); t0 = Date.now(); } })
                .catch(() => { if (b) b.disabled = false; yaz(d.hata, true); });
              return;
            }
            if (d.gonderim === "whatsapp" && d.wa) { window.open(`https://wa.me/${d.wa}?text=${encodeURIComponent(govde)}`, "_blank", "noopener"); return; }
            if (d.eposta) {
              const konu = [d.konu || "", konuMetin()].filter(Boolean).join(" - ");
              location.href = `mailto:${d.eposta}?subject=${encodeURIComponent(konu)}&body=${encodeURIComponent(govde.replace(/\n/g, "\r\n"))}`;
            }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
      form(s, P, az);
    });
  })();
</script>
